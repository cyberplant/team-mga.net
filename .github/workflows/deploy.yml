name: Deploy

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    types:
      - closed

permissions:
  pull-requests: write

env:
  REMOTE_USER: team_mga
  REMOTE_HOST: roji.net
  REMOTE_BASE: team-mga.net

jobs:
  # Deploy de produccion: push a main
  deploy-production:
    name: Deploy produccion
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host %s\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$REMOTE_HOST" "$REMOTE_HOST" "$REMOTE_USER" >> ~/.ssh/config

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'upload.sh' \
            --exclude 'setup-deploy-key.sh' \
            --exclude 'particles-test.html' \
            --exclude '.DS_Store' \
            ./ "$REMOTE_USER@$REMOTE_HOST:~/$REMOTE_BASE/"

      - name: Notify
        run: 'echo "Deployado a produccion: https://team-mga.net/"'

  # Deploy de preview: push a cualquier branch que no sea main
  deploy-preview:
    name: Deploy preview (${{ github.ref_name }})
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host %s\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$REMOTE_HOST" "$REMOTE_HOST" "$REMOTE_USER" >> ~/.ssh/config

      - name: Sanitize branch name
        id: branch
        run: |
          SAFE=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/\.\.*/-/g')
          echo "safe_name=$SAFE" >> $GITHUB_OUTPUT
          echo "Branch segura: $SAFE"

      - name: Deploy via rsync
        env:
          SAFE_NAME: ${{ steps.branch.outputs.safe_name }}
        run: |
          REMOTE_PATH="~/$REMOTE_BASE/branch/$SAFE_NAME/"
          echo "Subiendo a: $REMOTE_PATH"
          ssh "$REMOTE_USER@$REMOTE_HOST" "mkdir -p ~/$REMOTE_BASE/branch/$SAFE_NAME"
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'upload.sh' \
            --exclude 'setup-deploy-key.sh' \
            --exclude 'particles-test.html' \
            --exclude '.DS_Store' \
            ./ "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"

      - name: Comentar PR con URL de preview
        env:
          SAFE_NAME: ${{ steps.branch.outputs.safe_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIEW_URL="https://team-mga.net/branch/$SAFE_NAME/"
          # Buscar PRs abiertos para esta branch
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ]; then
            # Buscar si ya existe un comentario nuestro con la URL
            EXISTING=$(gh pr view "$PR_NUMBER" --json comments --jq '.comments[] | select(.body | contains("Preview deployada")) | .id' 2>/dev/null | tail -1 || echo "")
            BODY="🚀 **Preview deployada:** $PREVIEW_URL"
            if [ -n "$EXISTING" ]; then
              # Actualizar comentario existente
              gh api repos/${{ github.repository }}/issues/comments/$EXISTING -X PATCH -f body="$BODY" 2>/dev/null || true
            else
              # Crear comentario nuevo
              gh pr comment "$PR_NUMBER" --body "$BODY"
            fi
          else
            echo "No hay PR abierto para esta branch. Preview en: $PREVIEW_URL"
          fi

  # Limpieza de preview: cuando se cierra/mergea un PR
  cleanup-preview:
    name: Limpiar preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          printf 'Host %s\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$REMOTE_HOST" "$REMOTE_HOST" "$REMOTE_USER" >> ~/.ssh/config

      - name: Sanitize branch name
        id: branch
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/\.\.*/-/g')
          echo "safe_name=$SAFE" >> $GITHUB_OUTPUT

      - name: Remove preview directory
        id: cleanup
        env:
          SAFE_NAME: ${{ steps.branch.outputs.safe_name }}
        run: |
          REMOTE_PATH="~/$REMOTE_BASE/branch/$SAFE_NAME"
          echo "Eliminando: $REMOTE_PATH"
          if ssh "$REMOTE_USER@$REMOTE_HOST" "test -d '$REMOTE_PATH' && rm -rf '$REMOTE_PATH' && echo 'DELETED' || echo 'NOTFOUND'"; then
            echo "result=ok" >> $GITHUB_OUTPUT
          else
            echo "result=error" >> $GITHUB_OUTPUT
          fi

      - name: Comentar resultado de limpieza en el PR
        env:
          SAFE_NAME: ${{ steps.branch.outputs.safe_name }}
          CLEANUP_RESULT: ${{ steps.cleanup.outputs.result }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ "$CLEANUP_RESULT" = "ok" ]; then
            BODY="🧹 **Preview eliminada:** se borró \`https://team-mga.net/branch/$SAFE_NAME/\` del servidor."
          else
            BODY="⚠️ **Hubo un problema al eliminar la preview** (\`https://team-mga.net/branch/$SAFE_NAME/\`). Revisar los logs del workflow."
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"

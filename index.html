    <style>
        * {

        }

        body {

            display: flex;

            justify-content: center;

        #bg-canvas {

        .container {

        .logo {

            -webkit-text-fill-color: transparent;

            margin-bottom: 0.5rem;
        }

        .slogan {

        .slogan .quote {

        .server-card {

            border: 1px solid rgba(255, 102, 0, 0.2);
            border-radius: 12px;
            padding: 2rem 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .server-card h2 {
            font-size: 1.3rem;

            margin-bottom: 1rem;

        }

        .server-ip {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: #fff;
            background: rgba(255, 102, 0, 0.1);
            border: 1px solid rgba(255, 102, 0, 0.3);
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            display: inline-block;

        .server-ip .label {

        .server-ip .copied {
            display: none;

            color: #4CAF50;

        }

        .server-ip.copied-ok .copied {

        .gt-banner {

        .gt-banner img {

        .gt-html-banner {

        .gt-html-banner iframe {

        .links {

        .links a {

        .game-info {

        .game-info span {

        footer {

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="container">
        <div class="logo">|MGA|</div>
        <div class="slogan">Mas que Gamers, <span class="quote">Amigos</span></div>

        <div class="server-card">
            <h2>Servidor Call of Duty 4</h2>

            <div class="game-info">
                <span>Team |MGA| S&amp;D</span> &middot; Call of Duty 4 &middot; Argentina
            </div>

            <div style="margin: 1.5rem 0;">
                <div class="server-ip" id="serverIp" onclick="copyIp()" title="Click para copiar">
                    <span class="label">IP del Servidor</span>
                    45.235.99.18:28960
                    <span class="copied">Copiado!</span>
                </div>
            </div>

            <div class="gt-banner">
                <a href="https://www.gametracker.com/server_info/45.235.99.18:28960/" target="_blank" rel="noopener">
                    <img src="https://cache.gametracker.com/server_info/45.235.99.18:28960/b_560_95_1.png" width="560" height="95" alt="GameTracker - Team MGA Server">
                </a>
            </div>

            <div class="gt-html-banner">
                <iframe src="https://cache.gametracker.com/components/html0/?host=45.235.99.18:28960&showMap=1&showCurrPlayers=1&showTopPlayers=1&showBlogs=0&width=350&bgColor=333333&titleBgColor=222222&titleColor=FF9900&borderColor=555555&linkColor=FFCC00&color1=222222&fontColor=CCCCCC" frameborder="0" scrolling="no" width="350" height="436"></iframe>
            </div>

            <div class="links">
                <a href="https://www.gametracker.com/server_info/45.235.99.18:28960/" target="_blank" rel="noopener">Ver en GameTracker</a>
                <a href="https://www.gametracker.com/clan/Team-MGA/" target="_blank" rel="noopener">Clan Team-MGA</a>
            </div>
        </div>

        <footer>
            <p>Team MGA &middot; <a href="https://www.gametracker.com/clan/Team-MGA/" target="_blank" rel="noopener">GameTracker</a></p>
        </footer>
    </div>

    <script>
        function copyIp() {
            var ip = '45.235.99.18:28960';
            var el = document.getElementById('serverIp');
            navigator.clipboard.writeText(ip).then(function() {
                el.classList.add('copied-ok');
                setTimeout(function() { el.classList.remove('copied-ok'); }, 2000);
            });
        }

        // Efecto de fondo: grid tactico + particulas flotantes
        (function() {
            var canvas = document.getElementById('bg-canvas');
            var ctx = canvas.getContext('2d');
            var particles = [];
            var w, h;
            var PARTICLE_COUNT = 130;

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }

            function initParticles() {
                particles = [];
                for (var i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 1.2,
                        vy: (Math.random() - 0.5) * 1.2,
                        size: Math.random() * 3.5 + 1.5,
                        alpha: Math.random() * 0.5 + 0.3,
                        hue: Math.random() < 0.7 ? 0 : 1 // 0=naranja, 1=amarillo
                    });
                }
            }

            function drawGrid() {
                var gridSize = 60;
                ctx.strokeStyle = 'rgba(255, 102, 0, 0.04)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (var x = 0; x <= w; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                }
                for (var y = 0; y <= h; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                }
                ctx.stroke();
            }

            function drawParticles() {
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;

                    var color = p.hue === 0
                        ? 'rgba(255, 102, 0, ' + p.alpha + ')'
                        : 'rgba(255, 204, 0, ' + p.alpha + ')';

                    // Glow
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
                    var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
                    grad.addColorStop(0, color);
                    grad.addColorStop(1, 'rgba(255, 102, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // Nucleo
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                }

                // Lineas entre particulas cercanas
                for (var i = 0; i < particles.length; i++) {
                    for (var j = i + 1; j < particles.length; j++) {
                        var dx = particles[i].x - particles[j].x;
                        var dy = particles[i].y - particles[j].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 130) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = 'rgba(255, 102, 0, ' + (0.15 * (1 - dist / 130)) + ')';
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }
            }

            function animate() {
                // Rastro: capa semi-transparente en vez de clear total
                ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
                ctx.fillRect(0, 0, w, h);
                drawGrid();
                drawParticles();
                requestAnimationFrame(animate);
            }

            resize();
            initParticles();
            animate();

            window.addEventListener('resize', function() {
                resize();
                initParticles();
            });
        })();
    </script>
</body>
</html>
